; Mass 프레임워크 설정.
;
; 표현(Representation)/LOD 계열 프로세서들은 엔진에서 bAutoRegisterWithProcessingPhases = false 로
; 선언되어 있다. 즉 프로젝트가 명시적으로 켜주지 않으면 매 틱 실행되지 않는다.
; 엔진 어디에서도 이들을 동적 등록하지 않으므로, 켜지 않으면 다음 증상이 나온다:
;   - 엔티티의 LOD가 초기값(EMassLOD::Max)에서 갱신되지 않음
;   - CurrentRepresentation이 계속 None
;   - 표현 액터가 전혀 스폰되지 않음 (에러도 경고도 없이 조용히)
;
; 시뮬레이션(이동/추적)은 정상 동작하므로 원인을 찾기 어렵다.

; 뷰어와의 거리/시야 정보를 수집해 FMassViewerInfoFragment를 채운다.
; 이게 없으면 아래 LOD 프로세서가 판단할 근거가 없다.
[/Script/MassLOD.MassLODCollectorProcessor]
bAutoRegisterWithProcessingPhases=True

; 수집된 정보로 각 엔티티의 시각화 LOD(High/Medium/Low/Off)를 결정한다.
[/Script/MassRepresentation.MassVisualizationLODProcessor]
bAutoRegisterWithProcessingPhases=True

; 결정된 LOD에 따라 실제 표현을 적용한다 — 액터 스폰/반납, ISM 인스턴스 갱신.
[/Script/MassRepresentation.MassVisualizationProcessor]
bAutoRegisterWithProcessingPhases=True
