[/Script/Engine.CollisionProfile]
; 적 → 기차 피해 판정 전용 트레이스 채널. 코드 쪽 대응은 TRCollisionChannel::Damage.
; 채널을 앞에 끼워 넣으면 인덱스가 밀리므로 추가는 반드시 맨 뒤에 할 것 (ATRTrain::BeginPlay 에서 ensure 로 검증한다).
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="TRDamage")
; 장갑 ATRArmor::DamageVolume 전용 프로파일. TRDamage 트레이스에만 반응하고 나머지는 전부 무시한다.
; 지정하지 않은 채널은 Block 이 기본이라 내장 채널을 전부 명시적으로 Ignore 해야 한다.
+Profiles=(Name="TRDamageVolume",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="TRDamage",Response=ECR_Block)),HelpMessage="장갑 피격 판정 볼륨. TRDamage 트레이스에만 반응하며 렌더링·상호작용에는 걸리지 않는다.")
; 상호작용(수리·설치·탑승) 대상 볼륨. UTRInteractionComponent 가 ECC_Visibility 로 라인트레이스하므로 Visibility 만 Block 한다.
; Pawn 은 Ignore — 실내에 놓이는 볼륨이라 Block 하면 보이지 않는 벽이 된다.
+Profiles=(Name="TRInteractable",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Block),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="TRDamage",Response=ECR_Ignore)),HelpMessage="상호작용 대상 볼륨. 조준선(Visibility)에만 걸리고 이동은 막지 않는다.")
; 기차 외부에 노출된 파츠(포탑 메시 등). Visibility 만 Ignore 해서 조준선에 안 걸린다 —
; 탑승·수리는 실내 조종 구조물로만 하고, 외부 메시는 상호작용 대상이 되면 안 되기 때문.
; 나머지 채널은 기본값 Block 이라 물리적으로는 그대로 막는다.
+Profiles=(Name="TRExteriorPart",CollisionEnabled=QueryAndPhysics,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Visibility",Response=ECR_Ignore)),HelpMessage="기차 외부 노출 파츠. 조준선에 걸리지 않아 실내에서만 상호작용된다.")
