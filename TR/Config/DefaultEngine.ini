[/Script/Engine.CollisionProfile]
; 커스텀 트레이스 채널. 코드 쪽 대응은 TRTypes.h 의 TRCollisionChannel 네임스페이스.
; 채널을 앞에 끼워 넣으면 인덱스가 밀리므로 추가는 반드시 맨 뒤에 할 것.
; TRDamage 는 ATRTrain::BeginPlay 에서 이름과 인덱스가 맞는지 ensure 로 검증한다.
; ECC_GameTraceChannel1 = TRDamage        적 → 기차 피해 판정 전용
; ECC_GameTraceChannel2 = LobbyInteract   판 시작 전 상호작용 트레이스 전용
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="TRDamage")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="LobbyInteract")
; --- 아래는 TR 전용 프로파일. 코드 쪽 대응은 TRTypes.h 의 TRCollisionProfile 네임스페이스.
; 주의: 프로파일에 명시하지 않은 채널은 Block 이 기본이다. 채널을 새로 추가하면
; 여기 있는 프로파일들에도 응답을 직접 넣어야 한다 (빠뜨리면 조용히 Block 된다).
+Profiles=(Name="TRDamageVolume",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="TRDamage"),(Channel="LobbyInteract",Response=ECR_Ignore)),HelpMessage="장갑 피격 판정 볼륨. TRDamage 트레이스에만 반응하며 렌더링·상호작용에는 걸리지 않는다.")
+Profiles=(Name="TRInteractable",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility"),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="TRDamage",Response=ECR_Ignore),(Channel="LobbyInteract",Response=ECR_Ignore)),HelpMessage="상호작용 대상 볼륨. 조준선(Visibility)에만 걸리고 이동은 막지 않는다. 로비에서는 잡히지 않는다.")
+Profiles=(Name="TRExteriorPart",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Visibility",Response=ECR_Ignore),(Channel="LobbyInteract",Response=ECR_Ignore)),HelpMessage="기차 외부 노출 파츠. 조준선에 걸리지 않아 실내에서만 상호작용된다.")
; 로비 전용 상호작용 대상(무전기·전화기·책 등). 판이 시작되면 조준선에서 사라진다.
; 물리를 유지하므로 실물 소품 메시에 그대로 씌울 수 있다.
+Profiles=(Name="TRLobbyInteractable",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Visibility",Response=ECR_Ignore),(Channel="TRDamage",Response=ECR_Ignore),(Channel="LobbyInteract",Response=ECR_Block)),HelpMessage="로비 전용 상호작용 대상. 판 시작 전 조준선(LobbyInteract)에만 걸린다.")
; 로비와 게임 양쪽에서 상호작용하는 대상(관제석). 콜리전은 판이 시작돼도 바뀌지 않고,
; 어느 UI 를 열지는 잡힌 뒤 코드가 IsMatchStarted() 로 가른다.
+Profiles=(Name="TRDualInteractable",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="TRDamage",Response=ECR_Ignore),(Channel="LobbyInteract",Response=ECR_Block)),HelpMessage="로비·게임 양쪽 상호작용 대상. 두 조준선 모두에 걸린다.")

